name: Deploy Example Site (GH Pages)
env:
  GO_VERSION: "1.23"
  HUGO_VERSION: "0.147.8"
  GH_PAGES_URL: https://nginxinc.github.io/nginx-hugo-theme

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Cancel any in-prog deployments if a newer push comes in.
concurrency:
  group: example-site-deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    environment:
      name: example-site
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@75d2e84710de30f6ff7268e08f310b60ef14033f #v3.0.0
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Build exampleSite
        working-directory: exampleSite
        run: hugo --gc -e production --baseURL="$GH_PAGES_URL"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: exampleSite/public
      - name: Deploy artifact to GH Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1


